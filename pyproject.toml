[project]
name = "iikocloud-manager"
version = "0.1.0"
description = "Асинхронный клиент для iikocloud API с rate limiting и автоматическим управлением токенами"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["iikocloud", "iiko", "api", "async", "rate-limiting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "iikocloud-client @ git+https://github.com/UserVanya/Iikocloud-py-SDK.git",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/UserVanya/Iikocloud-manager"
Repository = "https://github.com/UserVanya/Iikocloud-manager"
Issues = "https://github.com/UserVanya/Iikocloud-manager/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iikocloud"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require real API access)",
    "slow: Slow tests",
    "lifecycle: Full create-edit-delete-restore cycles",
    "write: Write tests that modify Cloud state",
    "test_server: Route non-write integration test to config.test.yml 'write' section",
    "danger_write: Write tests that create/cancel orders, mutate stop lists or balances on the dedicated write organization",
]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
