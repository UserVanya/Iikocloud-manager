read:
  api_key: "read_api_key"
  app_id: "read_app_id"
  client_secret: "read_client_secret"

write:
  api_key: "write_api_key"
  app_id: "write_app_id"
  client_secret: "write_client_secret"
  # id программы лояльности стенда — для теста add_customer_to_program
  # (API требует явный programId; без ключа тест скипается)
  program_id: "00000000-0000-0000-0000-000000000000"
  # id внешнего меню стенда — для drafts lifecycle
  # (обязательное поле DeliveryOrderDraft; без ключа соответствующие шаги skip)
  menu_id: "00000000-0000-0000-0000-000000000000"
  # id сотрудника стенда — для drafts lifecycle
  # (обязательное поле SaveDraftRequest; без ключа соответствующие шаги skip)
  employee_id: "00000000-0000-0000-0000-000000000000"
